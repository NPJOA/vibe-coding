name: PLTR Institutional Holdings Bot

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 * * * *"  # every hour, on the hour

permissions:
  contents: write

jobs:
  check-and-notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run PLTR institutional holdings bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/pltr_institutional_bot.py

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/pltr_institutions_state.json
          git diff --cached --quiet || git commit -m "Update PLTR institutional holdings state [skip ci]"
          git push
